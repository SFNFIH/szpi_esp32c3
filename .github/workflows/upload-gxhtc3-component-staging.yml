name: Upload GXHTC3 to ESP Component Registry (staging)

on:
  push:
    branches:
      - demo
    paths:
      - 'components/gxhtc3/**'
      - '.github/workflows/upload-gxhtc3-component-staging.yml'
  workflow_dispatch:

jobs:
  upload_components_staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Upload gxhtc3 to staging registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "gxhtc3: components/gxhtc3"
          namespace: "SFNFIH"
          version: "0.1.0"
          registry_url: "https://components-staging.espressif.com"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
